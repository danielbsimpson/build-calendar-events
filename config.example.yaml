# Copy this file to `config.yaml` and edit it.
# Secrets (SMTP username/password) belong in `.env`, not here.

# How far ahead to look for events (in days). Events beyond this are ignored.
look_ahead_days: 120

# Default reminders (minutes before start) added to every event as VALARMs.
# Set to an empty list ([]) to disable reminders.
default_alarms:
  - 1440  # 1 day before
  - 30    # 30 minutes before

# Optional iCalendar COLOR (RFC 7986), e.g. a CSS3 color name like "tomato".
# Honored by Google Calendar and some clients; Apple Calendar colors events by
# their containing calendar, so a subscribed feed is more reliable there.
event_color: tomato

# Which sources to run. Names must match registered sources
# (see src/calendar_events/sources/base.py).
sources:
  - ufc
  - f1

# Where generated .ics files and the dedup store live.
data_dir: data
store_file: data/sent_events.json

# Email delivery settings. Username/password come from environment variables
# (SMTP_USERNAME / SMTP_PASSWORD) so they are never committed.
email:
  to: you@example.com
  from: you@example.com
  subject_prefix: "[Sports Calendar] "
  # iCalendar METHOD written into the .ics. Use PUBLISH for a subscribe-style
  # feed, or REQUEST if you want clients to treat messages as meeting invites.
  invite_method: PUBLISH
  smtp:
    host: smtp.gmail.com
    port: 587
    use_tls: true

# Per-source options (optional). Each source may read its own block.
source_options:
  f1:
    # Include support sessions (practice/qualifying/sprint) as separate events.
    include_sessions: false
  ufc:
    # Only include numbered PPV events, or set false to include Fight Nights too.
    ppv_only: false

# Richer event descriptions (fight cards, F1 track/session/weather).
enrichment:
  fight_card: true      # UFC: list every bout on the card
  weather: true         # F1: add a race-day weather line (Open-Meteo, keyless)
  # Optional: rewrite the assembled facts with a local LLM. Off by default.
  use_llm: false
  llm_backend: ollama   # "ollama" or "llamacpp"
  llm_model: llama3
  llm_endpoint: http://localhost:11434
